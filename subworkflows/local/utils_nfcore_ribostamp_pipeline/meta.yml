# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "utils_nfcore_ribostamp_pipeline"
description: |
  Pipeline-level utility subworkflow for nf-core/ribostamp. Provides
  PIPELINE_INITIALISATION (parameter validation, samplesheet parsing, nf-schema
  plugin setup, nf-core banner) and PIPELINE_COMPLETION (email notification,
  completion summary).
keywords:
  - utility
  - initialisation
  - validation
  - nf-core
  - nf-schema
components:
  - utils_nfschema_plugin
  - utils_nfcore_pipeline
  - utils_nextflow_pipeline
input:
  - version:
      type: boolean
      description: Display pipeline version and exit.
  - validate_params:
      type: boolean
      description: Validate parameters against nextflow_schema.json at runtime.
  - monochrome_logs:
      type: boolean
      description: Disable ANSI colour codes in log output.
  - nextflow_cli_args:
      type: list
      description: Positional Nextflow CLI arguments passed through to UTILS_NFCORE_PIPELINE.
  - outdir:
      type: string
      description: Output directory path; used for pipeline completion checks.
  - input:
      type: string
      description: Path to the input samplesheet CSV.
output:
  - samplesheet:
      type: list
      description: |
        Classified and validated samplesheet channel. Each item is a tuple whose
        structure depends on mode and start point (bulk FASTQ/BAM or sc FASTQ/BAM).
  - versions:
      type: file
      description: versions.yml files from utility subworkflows.
authors:
  - "@aravind.sunda"
maintainers:
  - "@aravind.sunda"
